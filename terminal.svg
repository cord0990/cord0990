<svg width="480" height="330" viewBox="0 0 480 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
  </defs>

  <!-- ventana -->
  <rect x="4" y="4" width="472" height="322" rx="12" fill="url(#termBg)" stroke="#30363d" stroke-width="1.5"/>
  <!-- barra de titulo -->
  <path d="M4,16 a12,12 0 0 1 12,-12 h448 a12,12 0 0 1 12,12 v20 h-472 Z" fill="#161b22"/>
  <circle cx="24" cy="20" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="5.5" fill="#27c93f"/>
  <text x="240" y="24" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#7d8590">diego@pucv: ~</text>

  <!-- arte ascii -->
  <g font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#e87b4f" xml:space="preserve">
    <text x="26" y="62"  opacity="0">██████╗ ██╗███████╗ ██████╗  ██████╗<animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.3s" fill="freeze"/></text>
    <text x="26" y="76"  opacity="0">██╔══██╗██║██╔════╝██╔════╝ ██╔═══██╗<animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.5s" fill="freeze"/></text>
    <text x="26" y="90"  opacity="0">██║  ██║██║█████╗  ██║  ███╗██║   ██║<animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.7s" fill="freeze"/></text>
    <text x="26" y="104" opacity="0">██║  ██║██║██╔══╝  ██║   ██║██║   ██║<animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.9s" fill="freeze"/></text>
    <text x="26" y="118" opacity="0">██████╔╝██║███████╗╚██████╔╝╚██████╔╝<animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.1s" fill="freeze"/></text>
    <text x="26" y="132" opacity="0">╚═════╝ ╚═╝╚══════╝ ╚═════╝  ╚═════╝<animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.3s" fill="freeze"/></text>
  </g>

  <!-- comandos -->
  <g font-family="'Courier New', Courier, monospace" font-size="13" xml:space="preserve">
    <text x="26" y="164" opacity="0"><tspan fill="#27c93f">$</tspan><tspan fill="#c9d1d9"> whoami</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1.8s" fill="freeze"/></text>
    <text x="26" y="184" opacity="0"><tspan fill="#7d8590">&gt; diego · estudiante de informática @ PUCV 🇨🇱</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="2.3s" fill="freeze"/></text>

    <text x="26" y="212" opacity="0"><tspan fill="#27c93f">$</tspan><tspan fill="#c9d1d9"> cat stack.txt</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="2.9s" fill="freeze"/></text>
    <text x="26" y="232" opacity="0"><tspan fill="#7d8590">&gt; java · c · python · sql</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="3.4s" fill="freeze"/></text>

    <text x="26" y="260" opacity="0"><tspan fill="#27c93f">$</tspan><tspan fill="#c9d1d9"> ./intereses.sh</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="4.0s" fill="freeze"/></text>
    <text x="26" y="280" opacity="0"><tspan fill="#7d8590">&gt; machine learning · kaggle · datos · finanzas</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="4.5s" fill="freeze"/></text>

    <text x="26" y="308" opacity="0"><tspan fill="#27c93f">$</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="5.0s" fill="freeze"/></text>
  </g>

  <!-- cursor -->
  <rect x="42" y="297" width="9" height="15" fill="#e87b4f" opacity="0">
    <animate attributeName="opacity" values="0;0" dur="5.0s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="5.1s" repeatCount="indefinite"/>
  </rect>
