<svg width="480" height="330" viewBox="0 0 480 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="focusBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
  </defs>

  <!-- ventana -->
  <rect x="4" y="4" width="472" height="322" rx="12" fill="url(#focusBg)" stroke="#30363d" stroke-width="1.5"/>
  <!-- barra de titulo -->
  <path d="M4,16 a12,12 0 0 1 12,-12 h448 a12,12 0 0 1 12,12 v20 h-472 Z" fill="#161b22"/>
  <circle cx="24" cy="20" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="5.5" fill="#27c93f"/>
  <text x="240" y="24" text-anchor="middle" font-family="Consolas, Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12" fill="#7d8590">diego@pucv: ~/focus</text>

  <!-- cat focus.txt -->
  <g font-family="Consolas, Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" xml:space="preserve">
    <text x="26" y="64" opacity="0"><tspan fill="#27c93f">$</tspan><tspan fill="#c9d1d9"> cat focus.txt</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.4s" fill="freeze"/></text>

    <text y="96"  opacity="0"><tspan x="26" fill="#e87b4f">LENGUAJES</tspan><tspan x="138" fill="#7d8590">→</tspan><tspan x="162" fill="#c9d1d9">java · c · python · sql</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.9s" fill="freeze"/></text>
    <text y="120" opacity="0"><tspan x="26" fill="#e87b4f">HERRAMIENTAS</tspan><tspan x="138" fill="#7d8590">→</tspan><tspan x="162" fill="#c9d1d9">git · jupyter · vs code</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1.2s" fill="freeze"/></text>
    <text y="144" opacity="0"><tspan x="26" fill="#e87b4f">APRENDIENDO</tspan><tspan x="138" fill="#7d8590">→</tspan><tspan x="162" fill="#c9d1d9">machine learning · pandas</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1.5s" fill="freeze"/></text>
    <text y="168" opacity="0"><tspan x="26" fill="#e87b4f">FOCO</tspan><tspan x="138" fill="#7d8590">→</tspan><tspan x="162" fill="#c9d1d9">datos · finanzas · kaggle</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1.8s" fill="freeze"/></text>
    <text y="192" opacity="0"><tspan x="26" fill="#e87b4f">ABIERTO A</tspan><tspan x="138" fill="#7d8590">→</tspan><tspan x="162" fill="#c9d1d9">colaboraciones · proyectos</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="2.1s" fill="freeze"/></text>

    <text x="26" y="230" opacity="0"><tspan fill="#27c93f">$</tspan><tspan fill="#c9d1d9"> ./objetivo.sh</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="2.7s" fill="freeze"/></text>
    <text x="26" y="256" opacity="0"><tspan fill="#7d8590">&gt; convertir datos en decisiones</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="3.2s" fill="freeze"/></text>

    <text x="26" y="306" opacity="0"><tspan fill="#27c93f">$</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="3.8s" fill="freeze"/></text>
  </g>

  <!-- cursor -->
  <rect x="42" y="294" width="9" height="15" fill="#e87b4f" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="3.9s" repeatCount="indefinite"/>
  </rect>
</svg>
