<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060c"/>
      <stop offset="70%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="duneBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#10151d"/>
    </linearGradient>
    <linearGradient id="duneFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a212e"/>
      <stop offset="100%" stop-color="#131923"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6edf3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e6edf3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orangeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0925e"/>
      <stop offset="100%" stop-color="#d96c3c"/>
    </linearGradient>
    <clipPath id="typeClip">
      <rect x="305" y="120" height="70" width="0">
        <animate attributeName="width" calcMode="discrete" fill="freeze" dur="2.5s"
          values="0;27;54;81;108;134;161;188;215;242;268;295;322;349;376;402;429;456;483;510;536;563;590;617;644;672"/>
      </rect>
    </clipPath>
  </defs>

  <!-- fondo -->
  <rect width="1280" height="400" fill="url(#sky)"/>

  <!-- estrellas -->
  <g fill="#e6edf3">
    <circle cx="90"  cy="60"  r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="130" r="1.2"><animate attributeName="opacity" values="1;0.15;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="48"  r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="90"  r="1.1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="42"  r="1.5"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="110" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="60"  r="1.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="140" r="1.1"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="55"  r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="1235" cy="120" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="545" cy="150" r="1.0"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="5.0s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="35" r="1.3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- luna -->
  <circle cx="1120" cy="90" r="70" fill="url(#moonGlow)"/>
  <circle cx="1120" cy="90" r="26" fill="#dde4ea" opacity="0.9"/>
  <circle cx="1112" cy="84" r="5" fill="#c3ccd4" opacity="0.6"/>
  <circle cx="1130" cy="98" r="3.5" fill="#c3ccd4" opacity="0.5"/>

  <!-- dunas -->
  <path d="M0,300 C180,240 360,320 560,285 C760,250 920,320 1120,280 C1200,265 1250,275 1280,270 L1280,400 L0,400 Z" fill="url(#duneBack)"/>
  <path d="M0,345 C220,300 420,370 660,335 C880,303 1040,372 1280,330 L1280,400 L0,400 Z" fill="url(#duneFront)"/>

  <!-- titulo con efecto de tipeo -->
  <g clip-path="url(#typeClip)">
    <text x="640" y="168" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="44" font-weight="bold" fill="#e6edf3" xml:space="preserve">Welcome to Diego's GitHub</text>
  </g>
  <!-- cursor que sigue al tipeo y luego parpadea -->
  <rect y="132" width="14" height="42" fill="#e87b4f" x="305">
    <animate attributeName="x" calcMode="discrete" fill="freeze" dur="2.5s"
      values="305;332;359;386;413;439;466;493;520;547;573;600;627;654;681;707;734;761;788;815;841;868;895;922;949;977"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="2.6s" repeatCount="indefinite"/>
  </rect>

  <text x="640" y="215" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="22" fill="#7d8590" opacity="0">
    &lt;/&gt; systems · data · machine learning
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="2.7s" fill="freeze"/>
  </text>

  <!-- ══════ escena esquina inferior derecha: personajito naranjo y gatito jugando ══════ -->

  <!-- sombras en el suelo -->
  <ellipse cx="1042" cy="356" rx="34" ry="6" fill="#000000" opacity="0.35"/>
  <ellipse cx="1196" cy="356" rx="32" ry="6" fill="#000000" opacity="0.35"/>

  <!-- personajito naranjo -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="1.2s" repeatCount="indefinite"/>
    <!-- cuerpo -->
    <rect x="1014" y="296" width="56" height="58" rx="20" fill="url(#orangeBody)"/>
    <!-- bracitos -->
    <circle cx="1010" cy="322" r="7" fill="#d96c3c">
      <animate attributeName="cy" values="322;312;322" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1074" cy="322" r="7" fill="#f0925e">
      <animate attributeName="cy" values="322;310;322" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- ojos -->
    <circle cx="1032" cy="318" r="6.5" fill="#ffffff"/>
    <circle cx="1052" cy="318" r="6.5" fill="#ffffff"/>
    <circle cx="1034" cy="318" r="3" fill="#1c1c1c">
      <animate attributeName="cy" values="318;315;318" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1054" cy="318" r="3" fill="#1c1c1c">
      <animate attributeName="cy" values="318;315;318" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- sonrisa -->
    <path d="M1034,334 Q1042,341 1050,334" stroke="#7a3416" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- rubor -->
    <ellipse cx="1024" cy="330" rx="4" ry="2.5" fill="#ff7a45" opacity="0.55"/>
    <ellipse cx="1060" cy="330" rx="4" ry="2.5" fill="#ff7a45" opacity="0.55"/>
  </g>

  <!-- gatito oscuro -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
    <!-- cola con movimiento -->
    <path d="M1222,340 Q1244,332 1240,310" stroke="#2b313a" stroke-width="8" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 1222 340; 14 1222 340; 0 1222 340" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <!-- orejas -->
    <path d="M1172,300 L1176,278 L1190,294 Z" fill="#2b313a"/>
    <path d="M1220,300 L1216,278 L1202,294 Z" fill="#2b313a"/>
    <path d="M1176,296 L1178,286 L1186,293 Z" fill="#e87b4f" opacity="0.85"/>
    <path d="M1216,296 L1214,286 L1206,293 Z" fill="#e87b4f" opacity="0.85"/>
    <!-- cabeza/cuerpo -->
    <rect x="1168" y="292" width="56" height="62" rx="24" fill="#343b46"/>
    <!-- patitas -->
    <circle cx="1164" cy="326" r="7" fill="#2b313a">
      <animate attributeName="cy" values="326;314;326" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1228" cy="326" r="7" fill="#343b46">
      <animate attributeName="cy" values="326;316;326" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <!-- ojos -->
    <circle cx="1186" cy="316" r="6.5" fill="#ffffff"/>
    <circle cx="1206" cy="316" r="6.5" fill="#ffffff"/>
    <circle cx="1188" cy="316" r="3" fill="#1c1c1c">
      <animate attributeName="cy" values="316;313;316" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1208" cy="316" r="3" fill="#1c1c1c">
      <animate attributeName="cy" values="316;313;316" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <!-- nariz y bigotes -->
    <path d="M1193,328 L1199,328 L1196,332 Z" fill="#e87b4f"/>
    <path d="M1196,332 Q1192,337 1188,335 M1196,332 Q1200,337 1204,335" stroke="#7d8590" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <line x1="1170" y1="326" x2="1158" y2="323" stroke="#7d8590" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="1170" y1="332" x2="1158" y2="333" stroke="#7d8590" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="1222" y1="326" x2="1234" y2="323" stroke="#7d8590" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="1222" y1="332" x2="1234" y2="333" stroke="#7d8590" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- pelota que se lanzan -->
  <g>
    <circle cx="0" cy="0" r="8" fill="#e87b4f" stroke="#f0f6fc" stroke-width="1.6"/>
    <path d="M-8,0 Q0,-4 8,0 M-8,0 Q0,4 8,0" stroke="#f0f6fc" stroke-width="1.2" fill="none"/>
    <animateMotion path="M1080,290 Q1120,214 1160,290 Q1120,214 1080,290" dur="2.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite" additive="sum"/>
  </g>
</svg>
